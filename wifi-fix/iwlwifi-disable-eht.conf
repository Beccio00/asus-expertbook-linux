# Intel BE211 (8086:e440) Wi-Fi 7 / 802.11be (EHT) is unstable under
# iwlwifi/iwlmld: EHT RX collapses to MCS0/NSS1 and MLO sessions tear down.
# Disabling EHT falls back to 802.11ax (Wi-Fi 6 / HE), which sustains full speed.
# Linux 7.2 C106 firmware can still emit misleading missed-beacon warnings while
# data flows; `patch.sh status wifi-fix` reports them. Remove this when Intel
# fixes the iwlwifi EHT path upstream.
options iwlwifi disable_11be=Y
